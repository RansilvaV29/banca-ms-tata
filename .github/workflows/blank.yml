name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test:
    name: Build y pruebas (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # si falla un servicio, igual termina el otro
      matrix:
        service: [ clientes-service, cuentas-service ]
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven            # cachea ~/.m2 entre ejecuciones

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw        # necesario si haces commit desde Windows

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify     # -B = modo batch, logs limpios

      - name: Guardar reporte de cobertura
        if: always()              # aunque fallen las pruebas
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco
          if-no-files-found: ignore
