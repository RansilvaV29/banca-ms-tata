server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: clientes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clientes_db}
    username: ${DB_USER:banca}
    password: ${DB_PASSWORD:banca123}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea BaseDatos.sql; Hibernate solo verifica que coincida con las entidades.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:banca}
    password: ${RABBITMQ_PASSWORD:banca123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.banca: INFO
