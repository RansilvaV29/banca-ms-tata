name: banca-microservicios
services:
  postgres:
    image: postgres:16-alpine
    container_name: banca-postgres
    environment:
      POSTGRES_USER: banca
      POSTGRES_PASSWORD: banca123
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./BaseDatgos.sql:/docker-entrypoint-initdb.d/01-BaseDatos.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h localhost fuerza TCP: solo responde cuando terminó de ejecutar BaseDatos.sql
      test: ["CMD-SHELL", "pg_isready -h localhost -U banca -d cuentas_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: banca-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: banca
      RABBITMQ_DEFAULT_PASS: banca123
    ports:
      - "5672:5672"
      - "15672:15672"   # consola web: http://localhost:15672 (banca / banca123)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
  clientes-service:
    build: ./clientes-service
    container_name: clientes-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clientes_db
      DB_USER: banca
      DB_PASSWORD: banca123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: banca
      RABBITMQ_PASSWORD: banca123
      TZ: America/Guayaquil
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  cuentas-service:
    build: ./cuentas-service
    container_name: cuentas-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cuentas_db
      DB_USER: banca
      DB_PASSWORD: banca123
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: banca
      RABBITMQ_PASSWORD: banca123
      TZ: America/Guayaquil
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
volumes:
  pgdata: